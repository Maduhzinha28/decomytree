
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>decomytree 🎄</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f5e9;color:#244638;font-family:Georgia,serif;text-align:center}
header{padding:45px 15px 20px}
h1{font-size:clamp(42px,10vw,65px);margin:10px;color:#18543d}
p{font-family:Arial,sans-serif;line-height:1.6}
main{max-width:500px;margin:auto;padding:20px}
.tree{font-size:150px;margin:15px}
.card{background:white;padding:28px 20px;border-radius:24px;box-shadow:0 8px 30px #174b3b15}
button{display:block;width:100%;padding:16px;margin:12px 0;border:0;border-radius:30px;background:#18543d;color:white;font-size:16px;cursor:pointer}
button.secondary{background:#e8f0e7;color:#18543d;border:1px solid #cbdccb}
footer{padding:25px;color:#718477;font:12px Arial}
</style>
</head>
<body>
<header>
<h1>decomytree ✦</h1>
<p>Uma árvore, muitos enfeites e cartinhas para abrir no Natal.</p>
</header>
<main>
<div class="card">
<div class="tree">🎄</div>
<h2>Seu Natal começa aqui!</h2>
<p>Crie sua árvore virtual e convide suas amigas para decorarem com enfeites e mensagens especiais.</p>
<button onclick="alert('Em breve: criação da sua árvore! 🎄')">🎄 Criar minha árvore</button>
<button class="secondary" onclick="alert('Em breve: decorar uma árvore! 💌')">💌 Decorar uma árvore</button>
</div>
</main>
<footer>decomytree • Um Natal cheio de carinho ✨</footer>
</body>
</html>
